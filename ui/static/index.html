<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobOps</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --ink:#e6e9ef; --dim:#9aa4b2;
          --accent:#5b9dff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:10px 18px; border-bottom:1px solid var(--line);
           background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; letter-spacing:.5px; }
  header .who { color:var(--dim); font-size:12px; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button { background:none; border:1px solid transparent; color:var(--dim); padding:6px 12px;
               border-radius:6px; cursor:pointer; font-size:13px; }
  nav button.active { background:#20263050; border-color:var(--line); color:var(--ink); }
  nav button:disabled { opacity:.35; cursor:not-allowed; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .app-picker { margin-left:auto; display:flex; gap:8px; align-items:center; }
  select, input, textarea, button.act { font:inherit; }
  select, input[type=text], textarea { background:#0c0e12; color:var(--ink); border:1px solid var(--line);
           border-radius:6px; padding:8px 10px; width:100%; }
  textarea { resize:vertical; min-height:120px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
  label { display:block; color:var(--dim); font-size:12px; margin:12px 0 4px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin:14px 0; }
  .panel h2 { margin:0 0 10px; font-size:14px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:180px; }
  button.act { background:var(--accent); color:#08101f; border:none; border-radius:6px; padding:8px 14px;
               font-weight:600; cursor:pointer; }
  button.act.sec { background:#252b36; color:var(--ink); }
  button.act:disabled { opacity:.4; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  tr.clickable { cursor:pointer; } tr.clickable:hover td { background:#1e2430; }
  .pill { display:inline-block; padding:1px 8px; border-radius:20px; font-size:11px; border:1px solid var(--line); }
  .v-PASS,.ok { color:var(--ok); } .v-FAIL,.bad { color:var(--bad); } .v-HIGH_RISK,.warn { color:var(--warn); }
  .muted { color:var(--dim); }
  .kw { display:grid; grid-template-columns:150px 90px 1fr; gap:6px; padding:5px 0; border-bottom:1px solid #20242e; font-size:12.5px; }
  .quote { color:var(--dim); font-style:italic; }
  iframe.preview { width:100%; height:520px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  pre.art { background:#0c0e12; border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto;
            max-height:480px; font-size:12px; white-space:pre-wrap; }
  .toast { position:fixed; bottom:16px; right:16px; background:var(--panel); border:1px solid var(--line);
           border-left:3px solid var(--accent); padding:10px 14px; border-radius:8px; max-width:420px; font-size:13px;
           box-shadow:0 6px 24px #0008; }
  .toast.err { border-left-color:var(--bad); } .toast.ok { border-left-color:var(--ok); }
  .gate-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat { background:#0c0e12; border:1px solid var(--line); border-radius:8px; padding:10px; }
  .stat .n { font-size:20px; font-weight:700; } .stat .l { color:var(--dim); font-size:11px; }
  .check { display:flex; gap:8px; align-items:flex-start; padding:4px 0; }
  .steps { color:var(--dim); font-size:12px; }
  code.cmd { background:#0c0e12; border:1px solid var(--line); border-radius:5px; padding:2px 6px; color:var(--accent); }
  /* --- Discover (job board) --- */
  .disc-controls { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin:2px 0 12px; }
  .disc-controls .grp { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
  .disc-controls .gl { color:var(--dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; margin-right:2px; }
  .chip { background:none; border:1px solid var(--line); color:var(--dim); padding:4px 10px; border-radius:6px;
          cursor:pointer; font-size:12px; font-family:inherit; }
  .chip:hover { color:var(--ink); }
  .chip[aria-pressed=true] { background:#20263050; border-color:var(--accent); color:var(--ink); }
  .disc-search { margin-left:auto; max-width:240px; }
  .disc-count { color:var(--dim); font-size:12px; margin:2px 0 6px; }
  .role-row { display:grid; grid-template-columns:52px 1fr auto; gap:6px 14px; align-items:start;
              padding:11px 2px; border-bottom:1px solid var(--line); }
  .role-row.stale { opacity:.5; }
  .fitb { font-weight:700; font-size:11.5px; padding:3px 0; border-radius:6px; color:#08101f; text-align:center; }
  .fit5{background:#3fb950;} .fit4{background:#7cbf46;} .fit3{background:#d29922;} .fit2{background:#e0803a;} .fit1{background:#f85149;}
  .role-row .rt { font-weight:600; }
  .role-row .rc { color:var(--dim); font-size:12.5px; }
  .role-row .rn { color:#c3cad6; font-size:12.5px; margin-top:4px; }
  .role-row .rq { color:#727a88; font-size:11.5px; font-family:ui-monospace,Menlo,monospace; margin-top:4px; }
  .role-row .rmeta { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:5px; }
  .role-row .rail2 { display:flex; flex-direction:column; gap:6px; align-items:flex-end; white-space:nowrap; }
  .tagm { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--dim); border:1px solid var(--line);
          border-radius:5px; padding:1px 6px; }
  .tagm.relo { color:var(--ok); border-color:#2f6f3f; }
  .tagm.live { color:var(--ok); } .tagm.likely { color:var(--warn); } .tagm.stale { color:var(--bad); }
  a.openx { color:var(--accent); font-size:12px; text-decoration:none; border:1px solid var(--line);
            border-radius:6px; padding:3px 9px; }
  a.openx:hover { border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>⚙ JobOps</h1>
  <nav id="nav"></nav>
  <div class="app-picker">
    <span class="who">localhost · viewer/orchestrator</span>
    <select id="appPicker" title="Select application"></select>
  </div>
</header>
<main id="view"></main>
<script src="/app.js"></script>
</body>
</html>
