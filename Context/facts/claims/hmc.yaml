- id: hmc-bev-replay-metric
  status: confirmed
  anchor: hmc-adas
  statement: Built and used BEV replay-based validation tooling that reduced repeated bus-only-lane road-test loops from about 10 trips to about 5 for similar false-detection issues, cutting scenario-debugging test time by about half (each trip roughly 4-5 hours) before final real-vehicle confirmation.
  ownership: independent
  deployment: production
  confidence: high
  source_quote:
    file: Context/Experiences/hmc_adas/context.yaml
    quote: Reduced repeated bus-only-lane road-test loops from about 10 trips to about 5 for similar false-detection issues. Since each trip could take roughly 4-5 hours, the tool helped cut scenario-debugging test time by about half before final real-vehicle confirmation.
  metrics:
  - id: hmc-bev-trip-reduction
    numbers:
    - 10
    - 5
    value: Reduced repeated bus-only-lane road-test loops from about 10 trips to about 5
    as_of: 2021-03 – present
    method: Approximate field observation of repeated bus-only-lane road-test loops for similar false-detection issues; self-reported, framed as 'about'.
    allowed_renderings:
    - from about 10 trips to about 5
    - about half
    - roughly halved the loops
  - id: hmc-bev-trip-duration
    numbers:
    - 4
    - 5
    value: each trip could take roughly 4-5 hours
    as_of: 2021-03 – present
    method: Approximate per-trip duration, self-reported, framed as 'roughly'.
    allowed_renderings:
    - roughly 4-5 hours
    - about 4 to 5 hours per trip
  terms:
  - bev-replay
  - validation-tooling
  - false-detection
  - log-replay
  - target-selection
  - test-time-reduction
  evidence:
  - type: repo
    ref: Context/Experiences/hmc_adas/context.yaml
    verifiable_by: public
  - type: repo
    ref: Context/experiences.yaml
    verifiable_by: public
  disclosure:
    public_safe: true
    omitted:
    - proprietary vehicle logs
    - internal ECU signal names
  notes: This is the ONLY quantified claim. Digits 10, 5, 4, 5 are verbatim in the quoted sentence. All figures are approximate ('about'/'roughly') and self-reported; as_of set to the ADAS role window (2021-03 – present) per owner. Ownership 'independent' reflects experiences.yaml 'Built and used replay-based validation tooling'.
