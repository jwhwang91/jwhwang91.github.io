title: "Engineering Narrative"
intro: "Two arcs that reinforce each other: a hardware-to-software systems arc (real motion-control hardware -> full V-cycle vehicle TCU software -> commercial-vehicle ADAS and AI-ready validation platforms), and a product-builder arc (self-shipped full-stack AI, web, and desktop applications)."
items:
  - "Physical constraints -> control logic: I turn hardware limits, sensing delays, and vehicle dynamics into algorithms and validation evidence."
  - "Problem -> product: I build the whole thing end to end, frontend, backend/APIs, LLM integration, and packaging, from an AI presentation editor (DeckFlip) to a multi-agent workflow studio (DecisionCanvas) to cross-platform desktop tools."
  - "Bottlenecks -> tools: when repeated manual work slows a team, I build the internal platform, in Python/C++/MATLAB for validation, or in TypeScript/React + FastAPI for apps."
  - "AI as a power tool, owned end to end: I treat AI both as an implementation accelerator and as a system I architect, owning requirements, interfaces, output validation/safety, and test, never shipping unverified model output."
  - "Public-safe technical storytelling: I explain protected or proprietary work through problem definition, architecture, logic abstraction, and engineering outcome."
