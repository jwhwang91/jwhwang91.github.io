# Example variant: tailors the backbone toward software / web / AI / app roles.
#
# The mirror of adas-controls.yaml. A variant is a thin "lens" over the backbone
# (Context/*.yaml); it ONLY lists overrides, anything omitted is inherited. Build:
#     python main.py --variant software-ai
# Output: Applications/software-ai/resume.html (noindex; reuses backbone CSS/assets).
#
# TUNED FOR ONE PAGE (A4). The deep detail lives on the live portfolio (every card
# links out), so this stays lean: short headline + one dense summary line, the two
# strongest roles with tight bullets, and the five products as one-liners (objective/
# impact/tags dropped). Variant resumes also render with a compact print density
# (body.variant-compact in Style/theme.css). To go richer (2 pages): restore the
# project objective/impact/tags overrides, re-add kaist-masters, and the toolchains.

id: software-ai
label: "Software / Web / AI focus (one page)"
noindex: true

# --- site overrides (software-forward identity + ATS strip) ---
site:
  title: "Software & AI Application Engineer"
  headline: "Full-stack & AI/LLM engineer who ships end to end — web apps, LLM pipelines, and cross-platform desktop apps — on an 8-year safety-critical embedded/controls foundation."
  one_liner: ""   # dropped for one-page density
  keywords:
    - "Full-Stack Development"
    - "AI / LLM Application Engineering"
    - "TypeScript / React / Next.js"
    - "Python · FastAPI"
    - "Anthropic Claude / OpenAI API"
    - "Multi-Agent / Agentic Systems"
    - "macOS / Desktop Apps"
    - "Software Architecture"
  main_focus: []   # summary dropped for one page — achievements live in the project lines below

# --- software-forward skill groups (3 dense groups for one-page density) ---
resume:
  skills:
    - label: "AI / LLM Engineering"
      items:
        - "LLM application engineering"
        - "Anthropic Claude / OpenAI API"
        - "Multi-provider LLM routing"
        - "Agentic / multi-agent workflows"
        - "AI output validation & safety"
    - label: "Full-Stack & Web"
      items:
        - "TypeScript / JavaScript"
        - "React / Next.js / Vite"
        - "FastAPI / REST APIs"
        - "Server-Sent Events"
        - "Supabase / Postgres"
    - label: "Apps, Desktop & Tooling"
      items:
        - "macOS app development"
        - "PySide6 / Qt · OAuth 2.0"
        - "Cross-platform packaging (Nuitka / PyInstaller)"
        - "Python · C/C++"
        - "pytest / Vitest / Playwright · Docker"

# --- experiences: two strongest roles, tight bullets, no per-exp keyword line ---
# (kaist-masters dropped from the one-pager; the M.S. still shows under Education)
experiences:
  include: [hmc-adas, add-k2-tcu]
  overrides:
    hmc-adas:
      hook: ""
      bullets:
        - "Built Python/C++ AI-transition toolchains running learned models on real vehicle signals (XCP/CAN-FD) and replay-based validation tooling; owned algorithm work (e.g. EKF sensor fusion) end to end."
      keywords: []
    add-k2-tcu:
      hook: ""
      bullets:
        - "Developed control-unit application software (control logic → calibration → validation) with MATLAB/Simulink plant models integrated into MIL/HIL, validated across the full V-cycle."
      keywords: []

# --- vehicle toolchains hidden for the one-page software resume ---
toolchains:
  include: []

# --- software products: the four strongest, one-liners (objective/impact/tags dropped).
# PathPilot is omitted from this one-page resume (in-development; it stays on the public
# portfolio). To include it, add `pathpilot` back to the include list below. ---
software:
  include: [deckflip, decisioncanvas, voiceprint, pinterest-exporter]
  overrides:
    deckflip:
      hook: "AI presentation editor — generates editable HTML/CSS/JS decks from a prompt via a multi-pass LLM pipeline; deployed at deckflip.net."
      objective: ""
      impact: ""
      tags: []
    decisioncanvas:
      hook: "Visual builder for auditable multi-agent AI workflows: typed node graph, async SSE execution engine, 4-provider LLM router, 80 pytest tests."
      objective: ""
      impact: ""
      tags: []
    voiceprint:
      hook: "Python + LLM assistant that learns a writer's voice and drafts posts; 1,000+ lines of resilient Playwright automation."
      objective: ""
      impact: ""
      tags: []
    pinterest-exporter:
      hook: "Cross-platform Python/Qt desktop app with a hand-rolled OAuth 2.0 flow; packaged for macOS and Windows."
      objective: ""
      impact: ""
      tags: []
    pathpilot:
      hook: "Keyboard-first macOS file manager (in development) with a shipped product site."
      objective: ""
      impact: ""
      tags: []
