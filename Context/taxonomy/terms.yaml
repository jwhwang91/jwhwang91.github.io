# Keyword taxonomy (MASTER_PLAN §4.1). Committed, public-safe, zero personal data.
# Alias matching is deterministic: case-insensitive, non-word-boundary, longest-first.
# Alias tiers:
#   exact       same thing, different spelling/case (HIL/HILS) — freely substitutable
#   equivalent  industry synonym / OEM brand (SCC <-> ACC) — claimable as direct
#   related     same family, NOT identical (LFA vs LKA) — caps support at partial (hedge)
# ambiguous: true marks short aliases whose letters collide with common words / other
#   meanings (ACC, CAN, MIL, BEV) — the human confirm at Gate G1 decides false positives.

