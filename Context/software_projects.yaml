# Software / Web / AI / Desktop products — the second spine of the backbone.
#
# These are self-built, public products that prove app/web/AI/desktop ability,
# independent of the automotive work. Each links to its real repo and/or live
# deployment (the artifact a reviewer can open), so no generated detail page is
# needed. Keep every claim TRUE and auditable: a reviewer who opens the repo or
# the live site must find exactly what is described here.
#
# Used by the dual-track public site and by per-JD variants (software:{include,overrides}).
# Order here is the default public order (software-forward, strongest first).

projects:
  - id: deckflip
    title: "DeckFlip — AI Presentation Editor"
    repo_name: DeckFlip
    repo_url: https://github.com/jwhwang91/DeckFlip
    live_url: https://deckflip.net
    category: software
    stack: TypeScript / React / Vite / Serverless / Supabase / Anthropic Claude + OpenAI
    hook: >-
      Full-stack web app that generates self-contained HTML/CSS/JS slide decks from a prompt,
      then lets you refine them by clicking, dragging, and re-prompting — every AI edit forced
      through a validation gate so the model never emits raw markup.
    objective: >-
      Make AI-generated presentations editable without touching code. A multi-pass LLM pipeline
      (plan -> foundation -> parallel per-slide generation -> deterministic assembly -> lint-gated
      QA repair) produces decks, and an in-browser editor lets users restyle them live while the
      AI is constrained to a safe, validated JSON patch/action vocabulary.
    impact: >-
      Deployed at deckflip.net. ~224-file TypeScript codebase with a provider fallback chain
      (Anthropic Opus -> OpenAI -> deterministic mock) so generation never hard-fails, a ~3,000-line
      sandboxed in-iframe DOM editor that preserves each deck's own CSS/JS/3D animations, a
      cross-device live audience layer over Supabase Realtime with row-level-security event replay,
      a multilingual UI (KO/EN/JA/ZH), and Vitest + Playwright test suites.
    tags:
      - TypeScript
      - React
      - Vite
      - LLM / AI
      - Anthropic Claude API
      - OpenAI API
      - Serverless
      - Supabase / Postgres
      - Realtime
      - Vitest / Playwright

  - id: decisioncanvas
    title: "DecisionCanvas Studio — Visual Multi-Agent AI Workflow Builder"
    repo_name: decisioncanvas-studio
    repo_url: https://github.com/jwhwang91/decisioncanvas-studio
    category: software
    stack: Next.js / React Flow / FastAPI / Python / Pydantic / Server-Sent Events / Docker
    hook: >-
      Full-stack studio for composing auditable multi-agent AI decision pipelines as typed node
      graphs, with a live-streaming execution engine and deterministic safety gates that run after
      the AI decision and cannot be bypassed by an agent.
    objective: >-
      Let non-trivial AI decision systems be built visually and audited. A React Flow canvas wires
      typed input/output ports into a graph, a compiler validates port compatibility and detects
      control cycles (Kahn topological sort), and an async engine executes the graph while streaming
      node/edge state to the UI over Server-Sent Events.
    impact: >-
      Working prototype (v0.3.0). ~832-line async execution engine, a pluggable LLM router across
      OpenAI / Gemini / Anthropic / Ollama with automatic offline mock fallback, an AI-independent
      safety subsystem (gate chain + regime classifier) evaluated after the model decision, ~20
      FastAPI REST endpoints plus SSE streaming, a YAML-manifest package system, and 80 pytest tests.
    tags:
      - Python
      - FastAPI
      - Next.js
      - React Flow
      - LLM / AI
      - Multi-Provider LLM
      - Server-Sent Events
      - Graph Algorithms
      - Pydantic
      - Docker / pytest

  - id: voiceprint
    title: "Voiceprint — Voice-Learning Writing Assistant"
    repo_name: voiceprint
    repo_url: https://github.com/jwhwang91/voiceprint
    category: software
    stack: Python / Playwright / BeautifulSoup / ffmpeg / LLM orchestration
    hook: >-
      ~3,600-line Python assistant that learns a writer's voice and photo-layout style from past
      posts, then drafts new ones — a clean split between deterministic Python (automation, scraping,
      media) and an LLM that does the writing, coupled only through files.
    objective: >-
      Cut repetitive drafting by separating mechanical work (browser control, scraping, media
      processing) from cognitive work (style learning, writing, photo layout), so each stage is
      independently runnable, testable, and debuggable.
    impact: >-
      1,000+ lines of resilient Playwright automation of a rich-text editor (iframe/contenteditable
      handling, defensive invariants derived from adversarial review), an ffmpeg pipeline doing
      motion-based frame sampling and 2-pass GIF rendering under size budgets, externalized YAML
      selectors for resilience to UI drift, and a safety-first design that always stops at
      "save as draft" for human approval.
    tags:
      - Python
      - Playwright
      - Browser Automation
      - Web Scraping
      - LLM Orchestration
      - ffmpeg / Media
      - Software Architecture

  - id: pinterest-exporter
    title: "Pinterest Reference Exporter — Cross-Platform Desktop App"
    repo_name: pinterest_reference_exporter
    repo_url: https://github.com/jwhwang91/pinterest_reference_exporter
    category: software
    stack: Python / PySide6 (Qt 6) / OAuth 2.0 / Nuitka / PyInstaller
    hook: >-
      Cross-platform desktop app (Python/Qt, packaged for macOS and Windows via Nuitka/PyInstaller)
      that authenticates to Pinterest via a hand-rolled OAuth 2.0 flow and batch-exports saved
      reference images to a local folder.
    objective: >-
      Give designers a one-click way to pull their saved reference boards offline, with a responsive
      Qt UI that never blocks during network or file IO.
    impact: >-
      OAuth 2.0 authorization-code flow built from scratch on the Python standard library (loopback
      callback server, CSRF state validation, silent refresh-token reconnect), all network/IO
      offloaded to dedicated QThread workers, a resilient downloader (highest-resolution variant
      selection, atomic writes, idempotent skip-existing), a 17-test unittest suite, and native
      packaging for macOS and Windows via Nuitka / PyInstaller.
    tags:
      - Python
      - PySide6 / Qt
      - Desktop App
      - OAuth 2.0
      - Multithreading
      - REST API
      - Cross-Platform Packaging

  - id: pathpilot
    title: "PathPilot — Keyboard-First macOS File Manager"
    # App source is in a PRIVATE repo (~70 Swift files, verified); link the live
    # product site — never the private repo (404 for reviewers). App Store listing
    # is finalized but NOT yet live, so do not claim a published App Store app.
    live_url: https://jwhwang91.github.io/pathpilot-site/
    category: software
    stack: Swift / SwiftUI + AppKit / StoreKit / App Sandbox (security-scoped bookmarks)
    hook: >-
      A feature-complete native macOS file manager built around a fast, keyboard-first, path-first
      workflow — editable address bar, dense details table, and a run-any-action command palette —
      now in preparation for Mac App Store release.
    objective: >-
      Give people who prefer a keyboard-driven, path-first file workflow a fast native macOS app,
      with no private APIs and no Full Disk Access — only the broad folders the user approves.
    impact: >-
      Built in SwiftUI for the app shell and AppKit where density matters (file table, address bar,
      keyboard handling): tabbed browsing, dual-pane copy/move, command palette, recursive search,
      zip/extract, folder compare and cleanup tools, and a user-approved-folder security model backed
      by security-scoped bookmarks. Monetized with a StoreKit one-time Pro unlock (no subscription),
      and safe-by-design — Trash-only deletes, always-available undo, and a no-telemetry, fully-offline
      posture — with a hand-built responsive product site for privacy and support.
    tags:
      - Swift
      - SwiftUI
      - AppKit
      - macOS
      - StoreKit
      - App Sandbox
      - Desktop App
