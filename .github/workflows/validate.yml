name: Validate

# Guards every push/PR: the test suite, backbone fact consistency, and the privacy
# guard (no private path or phone number may enter the public tree). This never
# deploys — deploy.yml owns publishing dist/.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Privacy guard (no private path or phone in the tracked tree)
        run: python scripts/privacy_guard.py

      # Context/facts/ and Context/variants/ are gitignored (see .gitignore), so on a
      # fresh clone of the public repo they are absent and both of these steps would
      # fail on missing input rather than on a real defect. Gate them on the registry
      # being present: locally — where the registry lives and where every resume is
      # actually generated — both run in full. Publicly, CI still guards the privacy
      # scan and the site build, which are the two things a public push can break.
      - name: Backbone fact consistency
        run: |
          if [ -d Context/facts ]; then
            python main.py --lint-facts
          else
            echo "Context/facts/ is private (gitignored) — fact lint runs locally only."
          fi

      - name: Test suite
        run: |
          if [ -d Context/facts ]; then
            python -m pytest -q
          else
            echo "Context/facts/ is private (gitignored) — the suite reads the registry, so it runs locally only."
          fi

      - name: Public site builds
        run: python main.py
